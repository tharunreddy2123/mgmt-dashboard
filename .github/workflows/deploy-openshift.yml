name: Deploy to OpenShift

on:
  push:
    branches: [main]
  workflow_dispatch:

# Required GitHub repository secrets:
#   OPENSHIFT_SERVER, OPENSHIFT_TOKEN, OPENSHIFT_NAMESPACE   (deployment target)
#   APP_OPENSHIFT_TOKEN, WATSONX_API_KEY, WATSONX_PROJECT_ID   (app config)
# Optional: WATSONX_BASE_URL, WATSONX_MODEL
# APP_OPENSHIFT_TOKEN: token of a READ-ONLY service account (ClusterRole `view`) used by the running app.
#   Do NOT reuse the deployer token - the app must never hold write access.

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install oc
        uses: redhat-actions/openshift-tools-installer@v1
        with:
          oc: latest

      - name: Log in to OpenShift
        uses: redhat-actions/oc-login@v1
        with:
          openshift_server_url: ${{ secrets.OPENSHIFT_SERVER }}
          openshift_token: ${{ secrets.OPENSHIFT_TOKEN }}
          namespace: ${{ secrets.OPENSHIFT_NAMESPACE }}
          insecure_skip_tls_verify: true

      - name: Create / update app secret
        run: |
          oc create secret generic ai-dashboard-secrets \
            --from-literal=OPENSHIFT_API_URL='${{ secrets.OPENSHIFT_SERVER }}' \
            --from-literal=OPENSHIFT_TOKEN='${{ secrets.APP_OPENSHIFT_TOKEN }}' \
            --from-literal=WATSONX_API_KEY='${{ secrets.WATSONX_API_KEY }}' \
            --from-literal=WATSONX_PROJECT_ID='${{ secrets.WATSONX_PROJECT_ID }}' \
            --from-literal=WATSONX_BASE_URL='${{ secrets.WATSONX_BASE_URL || 'https://eu-gb.ml.cloud.ibm.com' }}' \
            --from-literal=WATSONX_MODEL='${{ secrets.WATSONX_MODEL || 'meta-llama/llama-3-3-70b-instruct' }}' \
            --dry-run=client -o yaml | oc apply -f -

      - name: Apply manifests
        run: oc apply -f openshift/app.yaml

      - name: Build backend image
        run: oc start-build ai-dashboard-backend --from-dir=backend --follow

      - name: Build frontend image
        run: oc start-build ai-dashboard-frontend --from-dir=. --follow

      - name: Wait for rollout
        run: |
          oc rollout status deployment/ai-dashboard-backend --timeout=300s
          oc rollout status deployment/ai-dashboard-frontend --timeout=300s
          echo "URL: https://$(oc get route ai-dashboard -o jsonpath='{.spec.host}')"
