image:
  registry: us.icr.io/ipc-kbc-mgmt-devops
  tag: "1.0.0"
pullSecret: all-icr-io
appSecret: ai-dashboard-secrets
environment: production
backend:
  replicas: 1
  resources:
    requests: { cpu: 100m, memory: 512Mi }
    limits: { memory: 512Mi }
frontend:
  replicas: 1
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { memory: 128Mi }
route:
  timeout: 180s
