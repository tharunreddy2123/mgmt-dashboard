apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: ai-dashboard
  annotations:
    haproxy.router.openshift.io/timeout: {{ .Values.route.timeout }}
spec:
  to:
    kind: Service
    name: ai-dashboard-frontend
  port:
    targetPort: 8080
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
