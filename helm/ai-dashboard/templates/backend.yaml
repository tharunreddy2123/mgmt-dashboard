apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-dashboard-backend
spec:
  replicas: {{ .Values.backend.replicas }}
  selector:
    matchLabels:
      app: ai-dashboard-backend
  template:
    metadata:
      labels:
        app: ai-dashboard-backend
    spec:
      imagePullSecrets:
        - name: {{ .Values.pullSecret }}
      containers:
        - name: backend
          image: {{ .Values.image.registry }}/ai-dashboard-backend:{{ .Values.image.tag }}
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: {{ .Values.appSecret }}
          env:
            - name: ENVIRONMENT
              value: {{ .Values.environment | quote }}
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
          resources:
{{ toYaml .Values.backend.resources | indent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: ai-dashboard-backend
spec:
  selector:
    app: ai-dashboard-backend
  ports:
    - port: 8000
      targetPort: 8000
